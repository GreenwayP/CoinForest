<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CoinForest Dashboard</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#172033;
}

header{
  background:#0b1728;
  color:white;
  padding:18px 6%;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:24px;
  font-weight:800;
}

.logout{
  border:0;
  background:#ef4444;
  color:white;
  padding:10px 16px;
  border-radius:8px;
  cursor:pointer;
  font-weight:700;
}

.container{
  width:min(1200px,92%);
  margin:30px auto;
}

.welcome{
  background:linear-gradient(135deg,#0b1728,#123b63);
  color:white;
  padding:30px;
  border-radius:18px;
  margin-bottom:25px;
  box-shadow:0 12px 30px rgba(0,0,0,.12);
}

.welcome h1{
  margin-bottom:8px;
}

.welcome p{
  color:#cbd5e1;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}

.card{
  background:white;
  padding:25px;
  border-radius:16px;
  box-shadow:0 8px 25px rgba(0,0,0,.06);
}

.card h3{
  margin-bottom:12px;
}

.balance{
  font-size:30px;
  font-weight:800;
  color:#123b63;
}

.actions{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:12px;
  margin-top:20px;
}

.action{
  border:0;
  padding:14px;
  border-radius:10px;
  background:#123b63;
  color:white;
  font-weight:700;
  cursor:pointer;
}

.action:hover{
  opacity:.9;
}

.status{
  margin-top:20px;
  padding:14px;
  background:#eef6ff;
  border-radius:10px;
  color:#164e7a;
}

@media(max-width:600px){
  header{
    padding:16px 4%;
  }

  .container{
    width:94%;
  }

  .welcome{
    padding:22px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">CoinForest</div>
  <button class="logout" id="logoutBtn">Logout</button>
</header>

<main class="container">

  <section class="welcome">
    <h1 id="welcomeTitle">Welcome to CoinForest</h1>
    <p id="welcomeText">Loading your account...</p>
  </section>

  <section class="grid">

    <div class="card">
      <h3>Main Wallet</h3>
      <div class="balance">$0.00</div>
      <p>Available balance</p>
    </div>

    <div class="card">
      <h3>Profit Wallet</h3>
      <div class="balance">$0.00</div>
      <p>Investment profits</p>
    </div>

    <div class="card">
      <h3>Account Status</h3>
      <div class="status" id="accountStatus">
        Checking account...
      </div>
    </div>

  </section>

  <section class="card" style="margin-top:20px">

    <h2>Quick Actions</h2>

    <div class="actions">
      <button class="action">Deposit</button>
      <button class="action">Send</button>
      <button class="action">Withdraw</button>
      <button class="action">Swap</button>
      <button class="action">Invest</button>
    </div>

  </section>

</main>

<script>
const API_BASE = "";

async function loadUser(){

  const token = localStorage.getItem("coinforest_token");

  if(!token){
    window.location.href = "index.html";
    return;
  }

  try{

    const response = await fetch(
      API_BASE + "/api/auth/me",
      {
        method:"GET",
        headers:{
          "Authorization":"Bearer " + token
        }
      }
    );

    const data = await response.json();

    if(!response.ok || !data.success){

      localStorage.removeItem("coinforest_token");
      window.location.href = "index.html";
      return;
    }

    const user = data.user;

    const name =
      user.first_name ||
      user.username ||
      user.email;

    document.getElementById("welcomeTitle").textContent =
      "Welcome, " + name;

    document.getElementById("welcomeText").textContent =
      user.email;

    document.getElementById("accountStatus").textContent =
      "Account: " +
      user.status +
      " • KYC: " +
      user.kyc_status;

  }catch(error){

    console.error(error);

    document.getElementById("welcomeText").textContent =
      "Unable to load your account.";
  }
}

document
  .getElementById("logoutBtn")
  .addEventListener("click", async()=>{

    const token =
      localStorage.getItem("coinforest_token");

    try{

      if(token){

        await fetch(
          API_BASE + "/api/auth/logout",
          {
            method:"POST",
            headers:{
              "Authorization":"Bearer " + token
            }
          }
        );
      }

    }catch(error){
      console.error(error);
    }

    localStorage.removeItem("coinforest_token");

    window.location.href = "index.html";
  });

loadUser();
</script>

</body>
</html>
